name: Lingos Daily Auto

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  run-lingos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run script
        env:
          LINGOS_USER: ${{ secrets.LINGOS_USER }}
          LINGOS_PASS: ${{ secrets.LINGOS_PASS }}
        run: python main.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingos-screenshots
          path: "*.png"
