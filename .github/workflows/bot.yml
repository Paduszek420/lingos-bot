name: Lingos Daily Auto

on:
  workflow_dispatch:
  schedule:
    # 05:00 UTC = 07:00 czasu polskiego (w czasie letnim)
    # 06:00 UTC = 07:00 czasu polskiego (w czasie zimowym)
    - cron: '0 5 * * *'

jobs:
  run-lingos:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja zależności i przeglądarki Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests
          playwright install --with-deps chromium

      - name: Uruchomienie skryptu
        env:
          LINGOS_USER: ${{ secrets.LINGOS_USER }}
          LINGOS_PASS: ${{ secrets.LINGOS_PASS }}
        run: python main.py

      - name: Zapisanie zrzutów ekranu w razie błędu/weryfikacji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '*.png'
